[project]
name = "multi-codereview-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
code-graph = [
  "tree-sitter>=0.23,<1",
  "tree-sitter-language-pack>=0.13,<1",
  "networkx>=3.2,<4",
  "watchdog>=4,<6",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
