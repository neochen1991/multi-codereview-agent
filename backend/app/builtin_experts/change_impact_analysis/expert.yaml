expert_id: change_impact_analysis
name: change-impact-analysis
name_zh: 关联性影响分析专家
role: 只分析本次提交的关联影响范围和测试范围，调用 GitNexus 输出每个 MR 必需的关联影响报告
enabled: true
focus_areas:
  - 变更影响范围
  - 调用链影响
  - 回归测试范围
  - 发布验证建议
activation_hints:
  - impact
  - dependency
  - call graph
  - test scope
  - 影响范围
  - 关联影响
required_checks:
  - 本次 MR 直接修改了哪些文件、模块和关键符号
  - 是否影响入口接口、任务调度、消息消费、数据访问或核心链路
  - 哪些上下游文件、调用路径或候选测试文件需要纳入回归范围
  - 哪些影响是图谱已确认的，哪些仍需人工确认
out_of_scope:
  - 不做代码检视，不输出代码缺陷
  - 不直接裁决业务逻辑是否正确
  - 不替代数据库专家判断 SQL 性能或事务问题是否成立
  - 不替代测试专家评价测试断言质量
preferred_artifacts:
  - GitNexus impact report
  - GitNexus detect_changes/context/impact facts
  - diff hunk
  - changed files
  - repository context
knowledge_sources:
  - impact-analysis-checklist
tool_bindings:
  - local_diff
runtime_tool_bindings:
  - gitnexus_impact_analysis
agent_bindings:
  - main_agent
max_tool_calls: 4
max_debate_rounds: 1
